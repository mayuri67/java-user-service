name: Java Spring Boot CI

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  # JOB 1: BUILD, TEST AND PACKAGE
  build-test:
    name: Build and Test Java Application
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the repository source code
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Configure Java and Maven caching
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Step 3: Verify Maven configuration
      - name: Validate Maven project
        run: mvn -B validate

      # Step 4: Compile code, run tests and package JAR
      - name: Build and test
        run: mvn -B clean verify

      # Step 5: Save the generated JAR for the Docker job
      - name: Upload application JAR
        uses: actions/upload-artifact@v4
        with:
          name: spring-boot-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 1

  # JOB 2: BUILD, SCAN AND PUBLISH DOCKER IMAGE
  docker-publish:
    name: Build, Scan and Push Docker Image
    runs-on: ubuntu-latest
    needs: build-test

    # Publish only after a successful push to main.
    # Pull requests and other branches do not publish images.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    permissions:
      contents: read

    steps:
      # Step 1: Checkout Dockerfile and other project files
      - name: Checkout source code
        uses: actions/checkout@v4

      # Step 2: Download the JAR produced by the first job
      - name: Download application JAR
        uses: actions/download-artifact@v4
        with:
          name: spring-boot-jar
          path: target/

      # Step 3: Build the Docker image
      - name: Build Docker image
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t "${DOCKERHUB_USERNAME}/java-user-service:${IMAGE_TAG}" \
            -t "${DOCKERHUB_USERNAME}/java-user-service:latest" \
            .

      # Step 4: Scan the local image for vulnerabilities
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/java-user-service:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      # Step 5: Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 6: Push images only after the security scan passes
      - name: Push Docker images
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push "${DOCKERHUB_USERNAME}/java-user-service:${IMAGE_TAG}"
          docker push "${DOCKERHUB_USERNAME}/java-user-service:latest"